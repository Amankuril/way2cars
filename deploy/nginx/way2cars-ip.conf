# WAY2CARS on a bare IP (no domain / HTTPS yet).
#   http://187.127.170.123/          → landing page            ┐
#   http://187.127.170.123/admin/    → admin panel             │ one static SPA build
#   http://187.127.170.123/user/     → renter web app          │ (frontend/dist → /var/www/way2cars/web)
#   http://187.127.170.123/vendor/   → host web app            ┘
#   http://187.127.170.123/api/      → API on 127.0.0.1:5000
# The release APKs talk to :5000 directly, so they work with or without this file.
# Note: browsers only allow geolocation and the camera capture hint on HTTPS; add TLS before launch.
#
#   sudo cp deploy/nginx/way2cars-ip.conf /etc/nginx/sites-available/way2cars.conf
#   sudo ln -s /etc/nginx/sites-available/way2cars.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/way2cars/web;
    index index.html;

    client_max_body_size 12M; # API accepts uploads up to 10 MB
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Hashed build assets: cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: every sub-app route falls back to index.html (src/main.jsx picks the app by path).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~ ^/(admin|user|vendor)(/|$) {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        expires 7d;
    }
}
