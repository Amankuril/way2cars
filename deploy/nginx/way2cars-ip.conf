# WAY2CARS on a bare IP (no domain / HTTPS yet).
#   http://187.127.170.123/admin/  → admin panel (static build)
#   http://187.127.170.123/api/    → API on 127.0.0.1:5000
# The release APKs talk to :5000 directly, so they work with or without this file.
#
#   sudo cp deploy/nginx/way2cars-ip.conf /etc/nginx/sites-available/way2cars.conf
#   sudo ln -s /etc/nginx/sites-available/way2cars.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 12M; # API accepts uploads up to 10 MB
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location = / {
        return 302 /admin/;
    }

    location /admin/ {
        alias /var/www/way2cars/admin/;
        try_files $uri $uri/ /admin/index.html;
    }
    location /admin/assets/ {
        alias /var/www/way2cars/admin/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        expires 7d;
    }
}
